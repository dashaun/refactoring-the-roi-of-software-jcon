<div class="big">Your production software is <span class="warn">unpatched</span>.</div>

<div class="big muted">Your business runs on it <span class="gold">anyway</span>.</div>

<script type="text/template">
<span class="kicker blue">the shift</span>

## CI/CD solved delivery

<div class="cols">
  <div class="col blue">
    <h3>CI/CD gave us</h3>
    <ul>
      <li>Repeatable releases</li>
      <li>Automated testing</li>
      <li>Confidence + velocity</li>
    </ul>
  </div>
  <div class="col red">
    <h3>But it did not give us</h3>
    <ul>
      <li>Systematized modernization</li>
      <li>Drift detection</li>
      <li>An upgrade path</li>
    </ul>
  </div>
</div>

<div class="big muted" style="font-size:0.85em; margin-top:0.4em">We made it easier to ship <span class="warn">outdated software</span>, faster.</div>

---

<span class="kicker teal">the shift</span>

## Refactoring belongs in CI/CD

<img src="images/pipeline-workflow.svg" alt="CI/CD pipeline plus a continuous remediation workflow: detect, rewrite, pull request, merge" style="height: 620px"/>

---

## What OpenRewrite is

<div class="frame">
<pre><code>type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_5
</code></pre>
</div>

<div class="big" style="font-size:1.05em; margin-top:0.3em">Migrations as <span class="accent">code</span>.</div>

<div class="muted" style="font-size:0.75em">A recipe encodes a transformation once. Then it runs, the same way, everywhere.</div>

---

<span class="kicker teal">the shift</span>

<div class="big">Refactoring is a <span class="accent">process</span>,<br/>not a project.</div>

---


<span class="kicker teal">the comparison</span>

<div class="cols">
  <div class="col teal">
    <h3>Advisor</h3>
    <div class="muted" style="font-size:0.68em">OpenRewrite</div>
    <ul>
      <li>versioned upgrade workflow</li>
    </ul>
  </div>
  <div class="col blue">
    <h3>Codex</h3>
    <div class="muted" style="font-size:0.68em">agent CLI</div>
    <ul>
      <li>independent upgrade run</li>
    </ul>
  </div>
  <div class="col violet">

    <ul>

<div class="muted" style="font-size:0.72em; margin-top:0.4em">Boot 2.7 / Java 8 to Boot 4.x / Java 25. Captured upgrade results.</div>

<span class="kicker violet">the question I get every week</span>

## "Why not just use AI?"

<div class="big muted" style="font-size:0.9em">It's the obvious answer in 2026. So let's take it seriously.</div>

---

<span class="kicker violet">consistency</span>

## What agents maintaining real codebases taught us

<div class="stats">
  <div class="stat">
    <div class="n red">233</div>
    <div class="l">days of evolution per task</div>
  </div>
  <div class="stat">
    <div class="n red">71</div>
    <div class="l">consecutive commits</div>
  </div>
  <div class="stat">
    <div class="n red">20/20</div>
    <div class="l">models below human MI score</div>
  </div>
</div>

<div class="muted" style="font-size:0.7em; margin-top:0.5em">SWE-CI (2026) &middot; Alibaba Group &amp; Sun Yat-sen University &middot; <a href="https://arxiv.org/html/2603.03823v4#S4.SS4">arXiv 2603.03823v4, §4.4</a></div>
<div class="muted" style="font-size:0.7em">Successfully solved tasks in Python repositories; comparison with human oracle code.</div>

---

## Same prompt. Different diffs.

<img src="images/ai-vs-recipe.svg" alt="Illustration of repeated agent runs versus reapplying a fixed recipe to the same input" style="height: 600px"/>

---

## Write once. Run everywhere.

<img src="images/recipe-reuse.svg" alt="One versioned recipe generates repository-specific pull requests across an organization" style="height: 560px"/>

---


<span class="kicker violet">so which is it?</span>

<div class="big">AI writes the <span class="violet">recipes</span>.</div>
<div class="big">Recipes apply the <span class="accent">change</span>.</div>

<div class="muted" style="font-size:0.75em; margin-top:0.3em">Use the agent once, where its brilliance pays. Use the recipe everywhere, where consistency pays.</div>

<span class="kicker teal">the destination</span>

## N-0, continuously

<div class="big" style="font-size:1.5em">N-0 means: on the <span class="accent">latest patch</span>.</div>
<div class="big muted" style="font-size:0.9em">Of the JVM. Of Spring Boot. Of everything you ship.</div>
<div class="big muted" style="font-size:0.9em">Always. Not "when we get to it."</div>

---

## Two ways to age

<img src="images/n0-stairs.svg" alt="Continuous small steps stay near the top versus one terrifying big-bang upgrade" style="height: 580px"/>

---

## What N-0 buys you

<div class="cols">
  <div class="col teal">
    <h3>security</h3>
    <ul>
      <li>CVE to fix in <strong>hours</strong></li>
      <li>CVEs become traffic, not fires</li>
      <li>CISO sleeps</li>
    </ul>
  </div>
  <div class="col amber">
    <h3>performance</h3>
    <ul>
      <li>New GC, virtual threads, AOT</li>
      <li>Lower cloud bills, every month</li>
      <li>Single digit gains, at scale</li>
    </ul>
  </div>
  <div class="col violet">
    <h3>people</h3>
    <ul>
      <li>Modern tools attract talent</li>
      <li>Less yak shaving</li>
      <li>Boring upgrades, happy teams</li>
    </ul>
  </div>
</div>

---

<span class="kicker teal">compounding</span>

<div class="big">Every day on N-0, the <span class="accent">next day is cheaper</span>.</div>
<div class="big muted" style="font-size:0.9em">Every day on N-6, the <span class="warn">upgrade gets bigger</span>.</div>

<span class="kicker amber">frontline stories</span>

## Good, Better, Best

<img src="images/gbb-ladder.svg" alt="Three tiers: good, better, best" style="height: 520px"/>

<div class="muted" style="font-size:0.7em">What I actually see, across orgs, industries, and continents, in 2026.</div>

---

## Good

<div class="cols">
  <div class="col blue">
    <ul>
      <li>One flagship app on N-0: Java 25, Boot 4.x</li>
      <li>OpenRewrite run <strong>manually</strong>, by hand</li>
      <li>CVEs blocked at the production gate</li>
    </ul>
    <h3>the catch</h3>
    <ul class="red">
      <li>Nothing scales past that one team</li>
      <li>Patching N-2 to N-1 still leaves CVEs open</li>
      <li>The fix depends on who remembers how</li>
    </ul>
  </div>
</div>

---

## Better

<div class="cols">
  <div class="col teal">
    <ul>
      <li>Remediation workflow in CI, for a growing set of repos</li>
      <li>Dependency visibility: what's end-of-life, and where</li>
      <li>One "dead" dependency, migrated off</li>
      <li>Even the untouched apps stay on N-0</li>
      <li>Outcomes measured in dollars</li>
    </ul>
  </div>
</div>

<div class="muted" style="font-size:0.7em; margin-top:0.5em">The tell: the app nobody develops anymore still gets its patches.</div>

---

## Best

<div class="cols">
  <div class="col amber">
    <ul>
      <li>Remediation runs org-wide, as its own workflow</li>
      <li>Proactive: "what's next", not "what broke"</li>
      <li>Named owners maintain the shared recipes</li>
      <li>New repos onboard monthly, pulled by gravity</li>
      <li>Legacy has an owner and an upgrade plan</li>
    </ul>
  </div>
</div>

---

## How do you pick<br/>which repos to start with?

> "I chose all of them."
<span class="who">Dov Katz</span>

## A passing build can miss a page

<div class="cols">
  <div class="col red">
    <h3>One mapping</h3>
    <pre><code class="language-java">@GetMapping("/greeting")</code></pre>
    <p style="font-size:0.7em">After the framework upgrade:<br/><code>/greeting</code> → 200<br/><code>/greeting/</code> → 404</p>
  </div>
  <div class="col teal">
    <h3>Preserve both paths</h3>
    <pre><code class="language-java">@GetMapping({
  "/greeting", "/greeting/"
})</code></pre>
    <p style="font-size:0.7em">Both paths → 200<br/>Same greeting, with or without a name.</p>
  </div>
</div>

<div class="muted" style="font-size:0.65em; margin-top:0.5em">Keep the endpoint assertions. Run verify. Boot the packaged app and check the pages.</div>

---
