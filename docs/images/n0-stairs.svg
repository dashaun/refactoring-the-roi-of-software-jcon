<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="stepTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#134E4A"/>
      <stop offset="100%" stop-color="#0F2E3A"/>
    </linearGradient>
  </defs>

  <style>
    .h { font-size: 30px; font-weight: 800; }
    .patch { font-size: 20px; font-weight: 700; fill: #2DD4BF; }
    .sub { font-size: 21px; font-weight: 600; fill: #93A8C4; }
    .axis { stroke: #223350; stroke-width: 2; }
  </style>

  <!-- ===== left: N-0 staircase ===== -->
  <text class="h" x="400" y="80" text-anchor="middle" fill="#2DD4BF">N-0: always on the latest patch</text>

  <!-- staircase: many small steps -->
  <g>
    <rect x="120" y="560" width="80" height="40" fill="url(#stepTeal)" stroke="#2DD4BF" stroke-opacity="0.4"/>
    <rect x="220" y="520" width="80" height="80" fill="url(#stepTeal)" stroke="#2DD4BF" stroke-opacity="0.4"/>
    <rect x="320" y="480" width="80" height="120" fill="url(#stepTeal)" stroke="#2DD4BF" stroke-opacity="0.4"/>
    <rect x="420" y="440" width="80" height="160" fill="url(#stepTeal)" stroke="#2DD4BF" stroke-opacity="0.4"/>
    <rect x="520" y="400" width="80" height="200" fill="url(#stepTeal)" stroke="#2DD4BF" stroke-opacity="0.4"/>
    <rect x="620" y="360" width="80" height="240" fill="url(#stepTeal)" stroke="#2DD4BF" stroke-opacity="0.4"/>

    <!-- the walker (org) stays on top -->
    <g transform="translate(120, 534)">
      <circle cx="40" cy="-14" r="10" fill="#2DD4BF"/>
      <rect x="30" y="-4" width="20" height="30" rx="8" fill="#2DD4BF"/>
      <animateTransform attributeName="transform" type="translate"
        values="120,534; 120,534; 220,494; 220,494; 320,454; 320,454; 420,414; 420,414; 520,374; 520,374; 620,334; 620,334"
        keyTimes="0;0.08;0.16;0.25;0.33;0.42;0.5;0.58;0.66;0.75;0.9;1"
        dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.92;1" dur="12s" repeatCount="indefinite"/>
    </g>

    <text class="patch" x="120" y="620">patch</text>
    <text class="patch" x="320" y="640">patch</text>
    <text class="patch" x="520" y="620">minor</text>
    <text class="patch" x="620" y="640">LTS</text>
  </g>

  <text class="sub" x="400" y="700" text-anchor="middle">small, boring, continuous. nothing accumulates.</text>

  <!-- divider -->
  <line x1="800" y1="60" x2="800" y2="700" stroke="#223350" stroke-width="2" stroke-dasharray="4 10"/>

  <!-- ===== right: big-bang cliff ===== -->
  <text class="h" x="1200" y="80" text-anchor="middle" fill="#F87171">big bang: every 3 years</text>

  <g>
    <rect x="900" y="600" width="520" height="60" fill="#1A2338" stroke="#F87171" stroke-opacity="0.3"/>
    <!-- long flatline, then one terrifying jump -->
    <path d="M 900 600 L 1380 600 L 1380 300 L 1420 300" stroke="#F87171" stroke-width="6" fill="none" stroke-linejoin="round"/>
    <!-- panic marks on the flat part -->
    <text x="1000" y="580" class="sub" fill="#93A8C4">drifting&#8230;</text>
    <text x="1300" y="580" class="sub" fill="#F87171">N-6</text>

    <!-- fire drill burst at the jump -->
    <g transform="translate(1450, 330)">
      <circle r="16" fill="#F87171">
        <animate attributeName="r" values="10;20;10" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="1140" y="250" text-anchor="middle" class="h" fill="#F87171" font-size="26">the fire drill</text>
    <text x="1140" y="288" text-anchor="middle" class="sub">6 quarters of change, landed in one sprint</text>
  </g>

  <text class="sub" x="1200" y="700" text-anchor="middle">huge, risky, and expensive. and it's already overdue.</text>
</svg>
